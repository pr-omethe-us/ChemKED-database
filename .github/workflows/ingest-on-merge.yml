# Fires when YAML files are merged into main/master.
# Dispatches a chemked-ingest event to kineticmodelssite so the
# self-hosted runner can pull the latest repo and sync the new
# files into the Django database.

name: Ingest Merged Data

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.yaml"
      - "**/*.yml"

jobs:
  dispatch-ingest:
    name: Dispatch DB Ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find merged YAML files
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Compare with the commit before the push. "git diff-tree HEAD" lists
          # nothing for a merge commit, and only the last commit of a push with
          # several commits. Fall back to the first parent if "before" is unknown.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD^1)
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BEFORE" HEAD \
            -- '*.yaml' '*.yml' \
            | grep -v '^\.' \
            | grep -v '.github/' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed files: $FILES"

      - name: Dispatch chemked-ingest to kineticmodelssite
        if: steps.changed.outputs.files != '[]' && steps.changed.outputs.files != ''
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PYTECK_REPO_OWNER: ${{ vars.PYTECK_REPO_OWNER || github.repository_owner }}
          PYTECK_REPO_NAME: ${{ vars.PYTECK_REPO_NAME || 'kineticmodelssite' }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          jq -n --argjson files "$FILES" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            '{event_type: "chemked-ingest",
              client_payload: {files: $files, commit_sha: $sha, ref: $ref}}' > payload.json
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$PYTECK_REPO_OWNER/$PYTECK_REPO_NAME/dispatches" \
            --data @payload.json
