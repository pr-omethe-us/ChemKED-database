comments:
  - Reactive volume-time profiles were obtained through personal communication with
    the authors. The volumes are normalized values. Simulations should be carried
    out using the constant U-V reactor model.
  - The authors determined the IDTs experimentally based on both the pressure profiles
    and the OH* profiles. They found that the two experimental results were quasi-identical,
    i.e., the differences were negligible. In the XML, the IDTs are defined based
    on the OH* profiles because it was found that numerically it gives much more stable
    results if a volume-time (or pressure-time) profile is considered due to the typically
    noisy nature of these profiles.
