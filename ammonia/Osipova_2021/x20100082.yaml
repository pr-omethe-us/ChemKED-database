comments:
  - In the paper, the temperature of the burner surface is reported to be 368 K. Through
    personal communication with the corresponding author, it was clarified that the
    unburnt gas temperature is also 368 K.
  - The numerical phi-Sl data were obtained through personal communication with the
    corresponding author.
  - 'The absolute uncertainties were calculated from the average reported relative
    confidence intervals: 10-15% (I considered the upper limit, 15%).'
  - phi = (0.5 * x_H2 + 0.75 * x_NH3) / x_O2 was assumed.
  - According to the authors, stretch effects are insignificant relative to the measurement
    uncertainties. Also, the burner rim was very thin, therefore, heat loss towards
    the burner rim was minimized.
