comments:
  - 'The flow rate (F[g m-2 s-2]) was calculated as follows: F[LPM] = F[SLPM] * T[K]/294.26
    * 1/P[atm] based on: http://www.dgflo.com/unitsofflow.pdf, where F[SLPM] = 2.1
    SLPM was given in the article at P = 101.3 kPa and T = 298 K. F[g m-2 s-1] = F[LPM]
    * M_av/ (Vm * A) = F[LPM] * M_av * P / (R * T * A), using the ideal gas law and
    A = 0.0016 m2 is the cross section of the burner given in the paper.'
  - The accuracy of the stable species composition measurements is approximately +/-3%
    and the accuracy of the temperature measurements is approximately +/- 2%.
