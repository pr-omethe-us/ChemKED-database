comments:
  - The inlet gas temperature (room temperature) is assumed to be 300 K.
  - 'The initial composition was estimated based on the following:'
  - 1. The phi values were reported. (phi = [H2] / 2[O2])
  - 2. "The NO mole fraction added to the unburned mixtures was nominally 200 ppm."
    (from paper) ([NO] = 0.0002)
  - 3. The N2 had tow different sources. One is air diluent ([N2]_air) and the otherone
    is neat N2 ([N2]_neat) . "The ratio of N2 to fuel in the mixtures did not exceed
    0.2" (from paper) So I assumed that [N2]_neat = 0.2. Moreover [N2] = [N2]_neat
    + [N2]_air.
  - '4. I rejected to use the following: "supposing that air is composed of 20.95%
    O2 and 70.95% N2" (from paper). I assumed the following air composition: [N2]_air
    / [O2] = 0.8 / 0.2 = 4.'
  - 5. [NO] + [H2] + [O2] + [N2]_air + [N2]_neat = 1. Five variable, five equations.
  - 'The experimental NO is reported on Fig. 7. in relative values. (X_NO^meas / X_NO^add)
    I assumed X_NO^add = 229 ppm due to the following: "When corrected for the change
    in the number of moles, this results in a mole fraction of 229 ppm in the hot
    gases." (from paper)'
  - On Fig. 7. the temperatures are obviously identifiable with the phi and mass flow
    values.
  - The uncertainty of the measured [NO] was calculated as the 95% confidence intervall
    of the measured data on fig 7. with the highest scatter (rombus, high T)
