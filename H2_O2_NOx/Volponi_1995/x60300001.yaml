comments:
  - The inlet gas temperature was chosen 431 K based on the temperature profile on
    Fig 2.
  - 'The flow rate (F) was calculated by the following data and formula: F[slm] =
    5.44 slm, M_average = 26.15 g/mol, d = 9.7 cm, A = (d/2)^2*PI; F[kg m-2 s-1] =
    const * F[slm] * M_average / A . Where const = 6,905*10^-4 based on http://www.dgflo.com/unitsofflow.pdf
    and the ideal gas law with values given above.'
  - The standard temperature in this definition is 70 °F (294.26 K). If I used the
    value of 298.15 K the difference would be 1.3%.
  - The experimental temperature was estimated with cubic B-spline interpolation based
    on Figure 2a.
