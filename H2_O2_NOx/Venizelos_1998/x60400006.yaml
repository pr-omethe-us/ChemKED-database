comments:
  - The inlet gas temperature was estimated with linear fitting of preheat region
    of the temperature profile. The chosen temperature is the intercept of this line.
  - 'The flow rate (F) was calculated by the following data and formula: F[slm] =
    3.90 slm, M_average = 27.73 g/mol, d = 6 cm, A = (d/2)^2*PI; F[kg m-2 s-1] = const
    * F[slm] * M_average / A . Where const = 6,905*10^-4 based on http://www.dgflo.com/unitsofflow.pdf
    and the ideal gas law with values given above.'
  - The standard temperature in this definition is 70 ?F (294.26 K). If I used the
    value of 298.15 K the difference would be 1.3%.
  - The NO profile was reported as NO/Ar. To get the NO concentration in ppm the digitized
    data was multiplied with the inlet Ar mole fraction which assume constant Ar mole
    fraction in the flame.
  - The experimental temperature was estimated with linear interpolation based on
    Figure 2. thermocouple data (neat flame).
