comments:
  - The inlet gas temperature was not reported. The estimation (950 K) was based on
    a similar flame reported by R. J. Martin et al., Combust. Flame. 80 (1990) 238-255.
  - 'Details of the estimation: In the flame by Roby T_max = 1600 K, same in the flame
    by Martin wich has 970 K burner surface temperature. This Roby article also says
    the levels of additives (NO) produced temperature perturbations of less than 30
    K.'
  - 'The flow rate (F) was calculated by the following data and formula: M_average
    = 0.02929 kg/mol, l_meas = 0.01 m, t = 0.005 s, p = 101325 Pa, R = 8.314 Pa m^3
    mol^-1 K^-1, T = 1520 K; F[kg m-2 s-1] = M_average * l_meas * p / t / R / T.'
  - 'Details of the estimation: Species and temperature measurements were made at
    positions from 1.0 mm to 10.0 mm above the burner surface, corresponding to reaction
    times from 0.5 ms to 5.0 ms. Over this range of positions, temperatures decreased
    from 1601K to 1498K. (from paper)'
  - 'I assumed the flame reaches 10 mm above the burner in 5 ms and the mean temperature
    in this volume is 1520 K. (Based on the reported and estimated data: 950 K at
    0 mm, 1600 K at 1 mm, 1500 K at 10 mm.)'
  - 'The temperature profile is estimated with linear interpolation based on the main
    text: Species and temperature measurements were made at positions from 1.0 mm
    to 10.0 mm above the burner surface, corresponding to reaction times from 0.5
    ms to 5.0 ms. Over this range of positions, temperatures decreased from 1601K
    to 1498K. (from paper)'
