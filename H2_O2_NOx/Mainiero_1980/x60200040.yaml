comments:
  - The temperature profile and the inlet gas temperature are estimated based on Fig.
    4. squere with interpolation and extrapolation.
  - 'The inlet gas temperature is assumed to be 300 K due to the utility of the simulations
    and some unclear hints from paper: N2 and NO were introduced as a room temperature
    mixture...'
  - The flow rate (F) was calculated as the product of the gas velocity and density.
    (F = v * rho = v * p * M_ave / R / T)
  - The dilution is not reported. I assumed pure reactive gas. Maybe not usable.
