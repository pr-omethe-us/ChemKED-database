comments:
  - The inlet gas temperature is assumed to be normal temperature (293 K).
  - The temperature profile was estimated with linear interpolation based on TABLE
    II
  - 'The flow rate (F) was calculated by the following data and formula: F[liter/min]
    = 7.81 l/min, M_average = 26.07 g/mol, d = 6 cm, A = (d/2)^2*PI; F[kg m-2 s-1]
    = const * F[liter/min] * M_average / A . Where const = 6,929*10^-4 (= p/R/T/6E4)'
  - The temperature in this definition (NTP) is 20 °C (293.15 K) and the pressure
    is 1 atm.
  - The concentration profiles are converted from molecule/cm3 to mole fractions with
    the ideal gas law to avoid simulation difficulties
