  - The temperature profile was estimated with linear interpolation based on TABLE
    II
  - 'The flow rate (F) was calculated by the following data and formula: F[liter/min]
    = 7.55 l/min, M_average = 26.94 g/mol, d = 6 cm, A = (d/2)^2*PI; F[kg m-2 s-1]
    = const * F[liter/min] * M_average / A . Where const = 6,929*10^-4 (= p/R/T/6E4)'
