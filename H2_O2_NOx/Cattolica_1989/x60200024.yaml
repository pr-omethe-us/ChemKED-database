    = 8.86 l/min, M_average = 23.21 g/mol, d = 6 cm, A = (d/2)^2*PI; F[kg m-2 s-1]
    = const * F[liter/min] * M_average / A . Where const = 6,929*10^-4 (= p/R/T/6E4)'
