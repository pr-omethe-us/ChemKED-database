comments:
  - The inlet gas temperature is assumed to be 300 K instead of 1700 K due to similar
    flames and the utility of the simulations. (At positions closest to the burner
    surface the flame temperature is in excess of 1700 K - from paper)
  - 'The flow rate (F) was calculated by the following data and formula: F[l/min]
    = 40 l/min, M_average = 0.03655 kg/mol, d = 0.06 m, A = (d/2)^2*PI; F[kg m-2 s-1]
    = const * F[l/min] * M_average / A . Where const = 6,903*10^-4 (=p/R/T/6E4)'
  - The standard temperature in this definition is 70 °F (294.26 K). If I used the
    value of 298.15 K the difference would be 1.3%. Pressure is 101325 Pa.
  - The experimental temperature was estimated with linear interpolation based on
    Fig. 2. (a) squere
