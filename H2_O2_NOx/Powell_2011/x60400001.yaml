    value (in ppm) given at the distence above the burner of 4.50 mm. This value is
    (5520/0.986788), because there was no peak value given in Table 1.
  - 'Inlet temperature was estimated based on the following: The initial inlet gas
    temperature was measured to be in the range of 295-300 K for the conditions studied.
    (from paper)'
  - The temperature profile during the experiment was estimated with linear interpolation
    based on Fig 1.
  - The digitized uncertainty data are left out from the xml because the reported
    uncertainty is 20% and the digitized data are too small.
